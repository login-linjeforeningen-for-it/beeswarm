services:
  llama_server:
    image: llama
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: llama_server
    ports:
      - "8081:8080"
    volumes:
      - ./models:/usr/bin/app/models 
    restart: always

  api:
    image: beeswarm_api
    build:
      context: ./api
      dockerfile: ./Dockerfile
    container_name: beeswarm_model_api
    restart: always
    depends_on:
      - llama_server
    ports:
      - "8083:8080"
    environment:
      API: ${API:-beeswarm}
      MODEL_API: http://llama_server:8080
    mem_limit: 1g
    cpus: "2.0"

  postgres:
    image: postgres:15
    container_name: beeswarm_database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-beeswarm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB:-beeswarm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beeswarm -d beeswarm"]
      interval: 5s
      retries: 5
    mem_limit: 1g
    cpus: "2.0"

volumes:
  postgres_data:
